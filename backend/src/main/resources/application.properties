spring.datasource.url=jdbc:mysql://localhost:3308/new_flexpath_final
spring.datasource.username=root
spring.datasource.password=pass

debug= true
logging=level:org.spring.framework.security=TRACE

fraho.jwt.token.path= /api/auth/login
#           where the login endpoint lives
fraho.jwt.token.expiration= 30 minutes
            #how long token is valud (<number> <unit>, like 1 hour)


            #I've included the below from Claude because I am not using it now but want to use it in the future.
            #As usual, everything I do is researched before implementing. However, refactors are fun :)
            # Signing secret. If left unset, the library generates a random one at every startup
            # (it logs a warning). Consequence: restarting the backend logs everyone out. That's fine
            # for development. For a stable secret, create a file with 48 random bytes, e.g.
            #   openssl rand -out jwt-secret.key 48
            # keep it out of git (.gitignore), and point to it:
            # hmac: ./jwt-secret.key

            # Defaults that already match what we want (shown for reference, no need to set):
            # algorithm: HS256           # HMAC signature using the secret above
            # header.enabled: true       # read "Authorization: Bearer <token>"
            # cookie.enabled: false      # don't use cookies for the token

